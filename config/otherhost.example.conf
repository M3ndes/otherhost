# otherhost configuration. Keep secrets and private keys out of this file.

otherhost_name=home-otherhost
host=CHANGE_ME
ssh_user=CHANGE_ME
ssh_port=2222
identity_file=.ssh/otherhost_ed25519
known_hosts_file=.ssh/otherhost_known_hosts

# Local ports forwarded from the Mac to the WSL host over SSH.
ports=3000,3001,8000,8080

# Windows/WSL resource policy. Adjust according to total desktop memory.
wsl_distribution=Ubuntu
wsl_memory=20GB
wsl_processors=8
wsl_swap=8GB
wsl_networking_mode=mirrored

# Optional project cloned by scripts/bootstrap-wsl.sh.
project_repository=
project_directory=

# Parent directory scanned by the local project dashboard.
projects_root=~/src

# These fields are used only by the explicit GitHub-key recovery workflow.
github_user=
ssh_public_key=
