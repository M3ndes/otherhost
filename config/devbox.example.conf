# devbox-bridge configuration. Keep secrets and private keys out of this file.

devbox_name=home-devbox
host=CHANGE_ME
ssh_user=CHANGE_ME
ssh_port=2222
identity_file=.ssh/devbox_bridge_ed25519

# Local ports forwarded from the Mac to the WSL host over SSH.
ports=3000,3001,8000,8080

# Windows/WSL resource policy. Adjust according to total desktop memory.
wsl_distribution=Ubuntu
wsl_memory=20GB
wsl_processors=8
wsl_swap=8GB
wsl_networking_mode=mirrored

# Optional project cloned by scripts/bootstrap-wsl.sh.
project_repository=
project_directory=

# Setup records the selected GitHub identity and exactly one public key here.
github_user=
ssh_public_key=
